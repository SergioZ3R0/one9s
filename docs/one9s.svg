<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Degradado azul de OpenNebula -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00adef" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <!-- Sombra suave para darle volumen a la nube -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00adef" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Nube construida con geometría perfecta (sin recuadro de fondo) -->
  <g filter="url(#shadow)" fill="url(#cloudGrad)">
    <!-- Círculo izquierdo -->
    <circle cx="75" cy="140" r="35" />
    <!-- Círculo central (más grande) -->
    <circle cx="128" cy="105" r="55" />
    <!-- Círculo derecho -->
    <circle cx="181" cy="135" r="40" />
    <!-- Base que une los círculos -->
    <rect x="75" y="110" width="106" height="65" />
  </g>

  <!-- Texto centrado en la nube -->
  <text x="128" y="148" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    one<tspan fill="#cceeff">9s</tspan>
  </text>
</svg>
